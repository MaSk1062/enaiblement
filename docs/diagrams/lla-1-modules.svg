<text x="56" y="946" font-family="'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="11" font-weight="450" fill="#64748b" text-anchor="start" opacity="1.0">Failure policy - 4/12 Firestore: 5xx returns an error envelope, no state mutation.  8: Gemini retried 5× with exponential backoff (1s→16s).  9: one schema-repair re-prompt, then the turn is returned as plain prose and the stage is NOT advanced.</text>
<text x="56" y="968" font-family="'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="11" font-weight="550" fill="#334155" text-anchor="start" opacity="1.0">Invariant - the stage only advances after the parsed payload has been persisted, so a crashed turn is always replayable.</text>
