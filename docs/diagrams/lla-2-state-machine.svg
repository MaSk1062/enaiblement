<text x="60" y="686" font-family="'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="11" font-weight="450" fill="#64748b" text-anchor="start" opacity="1.0">Recovery — because the whole AgentState is one document written in a single update(), a failed turn leaves the session on its previous stage.</text>
<text x="60" y="706" font-family="'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="11" font-weight="450" fill="#64748b" text-anchor="start" opacity="1.0">The client reconciles by re-reading the session on reconnect; no server-side in-memory agent state exists, so any Cloud Run instance can serve any turn.</text>
<text x="60" y="734" font-family="'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="11" font-weight="550" fill="#334155" text-anchor="start" opacity="1.0">Cold-start note — stateless instances mean scale-to-zero is safe; the trade-off is a ~1–2s cold start on the first turn after idle.</text>
